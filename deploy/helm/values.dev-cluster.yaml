# Isolated dev install for a SHARED cluster.
#
# The difference from values.dev.yaml is footprint, not features. That file targets a
# single-node dev box and is fine there; on a shared cluster it creates a ClusterRole
# granting every verb on every resource in every namespace, two node-unpinned hostPath
# PersistentVolumes (cluster-scoped), and two Ingresses claiming a hostname.
#
# With this file the install owns exactly one namespace and nothing outside it.

namespace: budconnect-dev
name: bud-connect

# Set per install -- a dev install is by definition a build of whatever branch is being
# tested, so there is no sensible default to commit here:
#   helm install ... --set image=dittops/budconnect:<branch>-<sha>
image: "dittops/budconnect:nightly"

# Nothing cluster-scoped: a namespaced Role granting get/list/watch on Secrets, which is
# all Dapr's secretstores.kubernetes component uses.
rbac:
  clusterScoped: false

# Seeding runs inside the FastAPI lifespan, BEFORE uvicorn serves, and the chart's startup
# probe allows 30s + 12x10s = 150s. A full catalog seed takes longer than that, so with
# seeding on startup the probe kills the pod mid-seed, forever: observed crash-looping at 7
# restarts with the seeder never finishing a pass.
#
# Seeding is therefore off at startup here, and driven by the `cron-tensorzero-sync` dapr
# binding instead -- which is where it belongs anyway, since that is what refreshes prices
# every 24h in normal operation. The endpoint is POST /model/cron-tensorzero-sync and it
# takes an asyncio lock, so a manual trigger and the cron cannot overlap.
#
# The real fix is for the seeder not to block readiness, or for the probe budget to be a
# chart value. Both are changes to shared behaviour, so they are not made here.
host: "connect.dev.bud.studio"

# One namespaced Ingress. Nothing claims this host today, so there is no collision, and the
# object is inert until DNS exists -- traefik simply holds a route nobody reaches.
#
# DNS: every ingress host in this cluster is a CNAME to `ingress.k8s.bud.studio`, which
# carries the 3 A and 3 AAAA records of the ingress entrypoints. So the record to create is
#   connect.dev.bud.studio.  CNAME  ingress.k8s.bud.studio.
# There is no wildcard for *.bud.studio and no external-dns in the cluster, so it has to be
# created by hand in whatever hosts the zone.
ingress:
  enabled: true

# Enabled once the DNS record existed -- http01 needs the name to resolve publicly, so
# turning this on first would just retry and fail on a loop.
#
# NOT the chart default `letsencrypt-prod`: that ClusterIssuer does not exist in this
# cluster. `letsencrypt-http01` is the only one present (production ACME, http01 solver on
# ingressClassName traefik, which is what this Ingress uses).
tls:
  enabled: true
  clusterIssuer: "letsencrypt-http01"
  secretName: "budconnect-dev-tls"

# The admin frontend is a separate image and a second thing to pull; the API is what this
# install exists to exercise.
admin:
  enabled: false

env:
  # values.yaml hardcodes the `bud-connect` namespace into these two. In any other
  # namespace they resolve to nothing and the app fails to connect, with the DNS error
  # buried in pod logs.
  PSQL_HOST: "postgresql-service.budconnect-dev"
  REDIS_URI: "redis-service.budconnect-dev:6379"

  PSQL_USER: "budconnect"
  PSQL_PASSWORD: "budconnect"
  PSQL_DB_NAME: "budconnect"

  INITIAL_ADMIN_USERNAME: "admin"
  INITIAL_ADMIN_EMAIL: "admin@budconnect.local"
  INITIAL_ADMIN_PASSWORD: "changeme"

  LOG_LEVEL: "DEBUG"

  # OFF, and this is not a preference. Seeding runs inside the FastAPI lifespan, before
  # uvicorn serves, and the chart's startup probe allows 30s + 12x10s = 150s. A full catalog
  # seed takes longer than that, so the probe kills the pod mid-seed and the seeder never
  # finishes a pass -- observed crash-looping at 7 restarts with zero rows written.
  #
  # Seeding is driven by the `cron-tensorzero-sync` dapr binding instead, which is where it
  # belongs: that is what refreshes prices every 24h in normal operation. Trigger it by hand
  # with POST /model/cron-tensorzero-sync; it holds an asyncio lock, so a manual run and the
  # cron cannot overlap.
  #
  # The real fix is for seeding not to block readiness, or for the probe budget to be a chart
  # value rather than hardcoded in deployment.yaml. Both change shared behaviour, so neither
  # is done here.
  RUN_SEEDERS_ON_STARTUP: "false"

# Dynamic provisioning instead of static hostPath PVs: no cluster-scoped PersistentVolume,
# and no chance of the pod landing on a node where the data directory is empty.
# openebs-lvm is this cluster's default class (WaitForFirstConsumer, so the volume is
# provisioned on whichever node the pod is scheduled to).
redis:
  dynamic: true
  storageClassName: "openebs-lvm"
  storage_size: 1Gi

postgres:
  dynamic: true
  storageClassName: "openebs-lvm"
  storage_size: 10Gi
