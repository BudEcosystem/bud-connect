---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: {{ .Values.env.PSQL_USER }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.env.PSQL_PASSWORD }}
        - name: POSTGRES_DB
          value: {{ .Values.env.PSQL_DB_NAME }}
        # Pin PGDATA to the mounted volume. The official postgres:18 image
        # changed its default data dir to /var/lib/postgresql/18/docker, which
        # is NOT the mounted PVC path below, so data would land on ephemeral
        # container storage and be lost on pod recreation. Setting PGDATA
        # explicitly keeps the data on the PVC regardless of image version.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data/pgdata
      volumes:
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: "{{ .Values.name }}-postgresql-database-data-pvc"
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgresql
  type: ClusterIP
---
---
{{- if not .Values.postgres.dynamic }}
apiVersion: v1
# Static hostPath PV. A PersistentVolume is CLUSTER-SCOPED, and this one carries no
# nodeAffinity -- on a multi-node cluster the pod can be scheduled onto a node where
# `host_path` is an empty directory, and Postgres comes up with no data and no error.
# Set `postgres.dynamic: true` to let the cluster's StorageClass provision instead.
kind: PersistentVolume
metadata:
  name: "{{ .Values.name }}-postgresql-pv"
  namespace: {{ .Values.namespace }}
spec:
  capacity:
    storage: {{ .Values.postgres.storage_size }}
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: {{ .Values.postgres.host_path }}
    type: DirectoryOrCreate
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Values.name }}-postgresql-database-data-pvc"
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage_size | default "10Gi" }}
  storageClassName: {{ .Values.postgres.storageClassName | default "local-path" | quote }}
